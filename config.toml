protocol = "other"
metrics_port = 3000

[binaries]
"snarkos" = "/etc/systemd/system/snarkos.service"

[net_observer]
enabled = true
provider = "NirvanaLab"
region = "San"
instance = "zenrock-new"
interval_seconds = 30
mtr_count = 5
mtr_max_hops = 30
mtr_timeout_seconds = 15

[[net_observer.targets]]
address = "8.8.8.8"
class_name = "public"
location = "California"
provider = "google"

